<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analogue Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="clock-header">
      <h1 class="clock-title">Keep calm and &lt;code/&gt;</h1>
      <!-- <p class="clock-subtitle">timeless moments, one second at a time</p> -->
    </div>
    <div class="clock">
      <div class="c1">
        <div class="c2">
          <div class="numbers" aria-hidden="true">
            <span style="--i: 0">12</span>
            <span style="--i: 1">1</span>
            <span style="--i: 2">2</span>
            <span style="--i: 3">3</span>
            <span style="--i: 4">4</span>
            <span style="--i: 5">5</span>
            <span style="--i: 6">6</span>
            <span style="--i: 7">7</span>
            <span style="--i: 8">8</span>
            <span style="--i: 9">9</span>
            <span style="--i: 10">10</span>
            <span style="--i: 11">11</span>
          </div>
          <div class="pin"><div class="inner"></div></div>
          <div id="hr"></div>
          <div id="min"></div>
          <div id="sec"></div>
        </div>
      </div>
    </div>
  </body>
</html>
