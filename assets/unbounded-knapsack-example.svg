<svg viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (REQUIRED) -->
  <rect width="850" height="400" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="425" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Unbounded Knapsack: Top-Down State-Space Tree</text>
  <text x="425" y="48" font-family="monospace" font-size="12" text-anchor="middle" fill="#7f8c8d">coins = [2, 3], amount = 5</text>

  <!-- Root node -->
  <rect x="362" y="65" width="76" height="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="5"/>
  <text x="400" y="84" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">i=2, a=5</text>

  <!-- Level 1: Skip 3 and Use 3 -->
  <!-- Skip 3 branch -->
  <path d="M 375,95 L 230,125" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <text x="285" y="105" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">skip 3</text>
  <rect x="192" y="125" width="76" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" rx="5"/>
  <text x="230" y="144" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">i=1, a=5</text>

  <!-- Use 3 branch -->
  <path d="M 425,95 L 570,125" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <text x="515" y="105" font-family="Arial, sans-serif" font-size="9" fill="#10b981">use 3</text>
  <rect x="532" y="125" width="76" height="30" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="5"/>
  <text x="570" y="144" font-family="monospace" font-size="10" text-anchor="middle" fill="#10b981">i=2, a=2</text>

  <!-- Level 2 from (1,5): Skip 2 and Use 2 -->
  <!-- Skip 2 from (1,5) -->
  <path d="M 205,155 L 110,185" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <text x="140" y="167" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">skip</text>
  <rect x="72" y="185" width="76" height="30" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" rx="5"/>
  <text x="110" y="204" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">i=0, a=5</text>
  <text x="110" y="228" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">= 0</text>

  <!-- Use 2 from (1,5) -->
  <path d="M 255,155 L 310,185" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <text x="295" y="167" font-family="Arial, sans-serif" font-size="9" fill="#10b981">use 2</text>
  <rect x="272" y="185" width="76" height="30" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="5"/>
  <text x="310" y="204" font-family="monospace" font-size="10" text-anchor="middle" fill="#10b981">i=1, a=3</text>

  <!-- Level 2 from (2,2): Skip 3 and Use 3 -->
  <!-- Skip 3 from (2,2) -->
  <path d="M 545,155 L 490,185" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <text x="500" y="167" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">skip</text>
  <rect x="452" y="185" width="76" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" rx="5"/>
  <text x="490" y="204" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">i=1, a=2</text>

  <!-- Use 3 from (2,2) - invalid -->
  <path d="M 595,155 L 680,185" stroke="#e74c3c" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <text x="655" y="167" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">use 3</text>
  <rect x="642" y="185" width="76" height="30" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" rx="5"/>
  <text x="680" y="204" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">a &lt; 0</text>
  <text x="680" y="228" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">= 0</text>

  <!-- Level 3 from (1,3): Skip and Use -->
  <!-- Skip from (1,3) -->
  <path d="M 285,215 L 210,245" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <rect x="172" y="245" width="76" height="30" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" rx="5"/>
  <text x="210" y="264" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">i=0, a=3</text>
  <text x="210" y="288" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">= 0</text>

  <!-- Use from (1,3) -->
  <path d="M 335,215 L 370,245" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <rect x="332" y="245" width="76" height="30" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="5"/>
  <text x="370" y="264" font-family="monospace" font-size="10" text-anchor="middle" fill="#10b981">i=1, a=1</text>

  <!-- Level 3 from (1,2): Skip and Use -->
  <!-- Skip from (1,2) -->
  <path d="M 465,215 L 440,245" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <rect x="402" y="245" width="76" height="30" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" rx="5"/>
  <text x="440" y="264" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">i=0, a=2</text>
  <text x="440" y="288" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">= 0</text>

  <!-- Use from (1,2) - SUCCESS -->
  <path d="M 515,215 L 570,245" stroke="#10b981" stroke-width="2" fill="none"/>
  <rect x="532" y="245" width="76" height="30" fill="#d1fae5" stroke="#10b981" stroke-width="2.5" rx="5"/>
  <text x="570" y="264" font-family="monospace" font-size="10" text-anchor="middle" fill="#10b981">i=1, a=0</text>
  <text x="570" y="288" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#10b981">= 1 ✓</text>

  <!-- Level 4 from (1,1): can't use 2 -->
  <path d="M 370,275 L 370,305" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <rect x="332" y="305" width="76" height="30" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" rx="5"/>
  <text x="370" y="324" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">i=0, a=1</text>
  <text x="370" y="348" font-family="monospace" font-size="10" text-anchor="middle" fill="#ec4899">= 0</text>

  <!-- Legend -->
  <rect x="670" y="305" width="160" height="85" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="5"/>
  <text x="750" y="323" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2c3e50">Legend</text>
  <rect x="680" y="333" width="12" height="12" fill="#d1fae5" stroke="#10b981" stroke-width="1" rx="2"/>
  <text x="700" y="343" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Use coin (same i)</text>
  <rect x="680" y="350" width="12" height="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="2"/>
  <text x="700" y="360" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Skip (i-1)</text>
  <rect x="680" y="367" width="12" height="12" fill="#fce7f3" stroke="#ec4899" stroke-width="1" rx="2"/>
  <text x="700" y="377" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Base case</text>
</svg>
