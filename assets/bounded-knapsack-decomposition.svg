<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (REQUIRED) -->
  <rect width="800" height="340" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="400" y="28" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#2c3e50">Bounded Knapsack: Binary Decomposition</text>

  <!-- Original item -->
  <text x="100" y="65" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Original Item:</text>
  <rect x="220" y="50" width="190" height="40" fill="#fce7f3" stroke="#ec4899" stroke-width="2" rx="5"/>
  <text x="315" y="74" font-family="monospace" font-size="12" text-anchor="middle" fill="#ec4899">quantity = 13</text>

  <!-- Arrow -->
  <path d="M 280,90 L 280,115" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="280,120 275,112 285,112" fill="#7f8c8d"/>
  <text x="300" y="108" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">decompose</text>

  <!-- Decomposed chunks -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">0/1 Chunks:</text>

  <rect x="220" y="130" width="50" height="35" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="5"/>
  <text x="245" y="153" font-family="monospace" font-size="14" text-anchor="middle" fill="#10b981">1</text>

  <text x="280" y="153" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">+</text>

  <rect x="295" y="130" width="50" height="35" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="5"/>
  <text x="320" y="153" font-family="monospace" font-size="14" text-anchor="middle" fill="#10b981">2</text>

  <text x="355" y="153" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">+</text>

  <rect x="370" y="130" width="50" height="35" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="5"/>
  <text x="395" y="153" font-family="monospace" font-size="14" text-anchor="middle" fill="#10b981">4</text>

  <text x="430" y="153" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">+</text>

  <rect x="445" y="130" width="50" height="35" fill="#e3f2fd" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="470" y="153" font-family="monospace" font-size="14" text-anchor="middle" fill="#3498db">6</text>

  <text x="510" y="153" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">= 13</text>

  <!-- Remainder label -->
  <text x="470" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#3498db">(remainder)</text>

  <!-- Examples section -->
  <rect x="50" y="200" width="700" height="110" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="8"/>
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">Representing Any Count 0-13</text>

  <!-- Example counts -->
  <text x="80" y="255" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Count 5:</text>
  <rect x="150" y="240" width="30" height="22" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="3"/>
  <text x="165" y="256" font-family="monospace" font-size="11" text-anchor="middle" fill="#10b981">1</text>
  <text x="190" y="256" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">+</text>
  <rect x="205" y="240" width="30" height="22" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="3"/>
  <text x="220" y="256" font-family="monospace" font-size="11" text-anchor="middle" fill="#10b981">4</text>
  <text x="250" y="256" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">= 5</text>

  <text x="310" y="255" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Count 9:</text>
  <rect x="380" y="240" width="30" height="22" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="3"/>
  <text x="395" y="256" font-family="monospace" font-size="11" text-anchor="middle" fill="#10b981">1</text>
  <text x="420" y="256" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">+</text>
  <rect x="435" y="240" width="30" height="22" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="3"/>
  <text x="450" y="256" font-family="monospace" font-size="11" text-anchor="middle" fill="#10b981">2</text>
  <text x="475" y="256" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">+</text>
  <rect x="490" y="240" width="30" height="22" fill="#e3f2fd" stroke="#3498db" stroke-width="1.5" rx="3"/>
  <text x="505" y="256" font-family="monospace" font-size="11" text-anchor="middle" fill="#3498db">6</text>
  <text x="535" y="256" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">= 9</text>

  <text x="80" y="290" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Count 13:</text>
  <rect x="150" y="275" width="30" height="22" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="3"/>
  <text x="165" y="291" font-family="monospace" font-size="11" text-anchor="middle" fill="#10b981">1</text>
  <text x="190" y="291" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">+</text>
  <rect x="205" y="275" width="30" height="22" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="3"/>
  <text x="220" y="291" font-family="monospace" font-size="11" text-anchor="middle" fill="#10b981">2</text>
  <text x="250" y="291" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">+</text>
  <rect x="265" y="275" width="30" height="22" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="3"/>
  <text x="280" y="291" font-family="monospace" font-size="11" text-anchor="middle" fill="#10b981">4</text>
  <text x="305" y="291" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">+</text>
  <rect x="320" y="275" width="30" height="22" fill="#e3f2fd" stroke="#3498db" stroke-width="1.5" rx="3"/>
  <text x="335" y="291" font-family="monospace" font-size="11" text-anchor="middle" fill="#3498db">6</text>
  <text x="365" y="291" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">= 13</text>

  <!-- Complexity note -->
  <text x="580" y="280" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6">4 chunks instead of 13</text>
  <text x="580" y="295" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6">O(log k) vs O(k)</text>
</svg>
