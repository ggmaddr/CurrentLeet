<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="750" height="350" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="375" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Common Bitmask Operations</text>
  <text x="375" y="48" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">mask = 0b1010 (elements {1, 3} in set)</text>

  <!-- Operation 1: Check if bit is set -->
  <rect x="30" y="70" width="220" height="120" fill="#ffffff" stroke="#3498db" stroke-width="2" rx="6"/>
  <text x="140" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">Check bit i</text>
  <text x="140" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="#2c3e50">mask &amp; (1 &lt;&lt; i)</text>
  <text x="140" y="138" font-family="monospace" font-size="10" text-anchor="middle" fill="#7f8c8d">1010 &amp; 0100 = 0000</text>
  <text x="140" y="158" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">→ 0 (bit 2 not set)</text>
  <text x="140" y="180" font-family="monospace" font-size="10" text-anchor="middle" fill="#7f8c8d">1010 &amp; 0010 = 0010</text>

  <!-- Operation 2: Set bit (add to set) -->
  <rect x="265" y="70" width="220" height="120" fill="#ffffff" stroke="#10b981" stroke-width="2" rx="6"/>
  <text x="375" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">Set bit i (add)</text>
  <text x="375" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="#2c3e50">mask | (1 &lt;&lt; i)</text>
  <text x="375" y="140" font-family="monospace" font-size="10" text-anchor="middle" fill="#7f8c8d">1010 | 0100</text>
  <text x="375" y="160" font-family="monospace" font-size="12" text-anchor="middle" fill="#10b981">= 1110</text>
  <text x="375" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">{1,3} → {1,2,3}</text>

  <!-- Operation 3: Clear bit (remove from set) -->
  <rect x="500" y="70" width="220" height="120" fill="#ffffff" stroke="#e74c3c" stroke-width="2" rx="6"/>
  <text x="610" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e74c3c">Clear bit i (remove)</text>
  <text x="610" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="#2c3e50">mask &amp; ~(1 &lt;&lt; i)</text>
  <text x="610" y="140" font-family="monospace" font-size="10" text-anchor="middle" fill="#7f8c8d">1010 &amp; 1101</text>
  <text x="610" y="160" font-family="monospace" font-size="12" text-anchor="middle" fill="#e74c3c">= 1000</text>
  <text x="610" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">{1,3} → {3}</text>

  <!-- Operation 4: Toggle bit -->
  <rect x="120" y="210" width="220" height="110" fill="#ffffff" stroke="#9b59b6" stroke-width="2" rx="6"/>
  <text x="230" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9b59b6">Toggle bit i</text>
  <text x="230" y="255" font-family="monospace" font-size="11" text-anchor="middle" fill="#2c3e50">mask ^ (1 &lt;&lt; i)</text>
  <text x="230" y="280" font-family="monospace" font-size="10" text-anchor="middle" fill="#7f8c8d">1010 ^ 0100 = 1110</text>
  <text x="230" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Flips bit 2: 0→1</text>

  <!-- Operation 5: Count set bits -->
  <rect x="410" y="210" width="220" height="110" fill="#ffffff" stroke="#f39c12" stroke-width="2" rx="6"/>
  <text x="520" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">Count bits (set size)</text>
  <text x="520" y="255" font-family="monospace" font-size="11" text-anchor="middle" fill="#2c3e50">bin(mask).count('1')</text>
  <text x="520" y="280" font-family="monospace" font-size="10" text-anchor="middle" fill="#7f8c8d">bin(10) = '0b1010'</text>
  <text x="520" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#f39c12">→ 2 bits set</text>
</svg>