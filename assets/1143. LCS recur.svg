<svg viewBox="0 0 750 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="750" height="400" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="375" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">Top-Down: Recursion Tree for LCS("ace", "abcde")</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Level 0: Root -->
  <g transform="translate(375, 60)">
    <rect x="-50" y="-18" width="100" height="36" fill="#e0f2fe" stroke="#3498db" stroke-width="2" rx="6"/>
    <text x="0" y="6" font-family="monospace" font-size="12" fill="#2c3e50" text-anchor="middle">lcs(0, 0)</text>
  </g>

  <!-- Level 1 -->
  <!-- lcs(0,0) with 'a'=='a' goes diagonal to lcs(1,1) -->
  <line x1="375" y1="78" x2="375" y2="115" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="395" y="100" font-family="Arial, sans-serif" font-size="10" fill="#10b981">'a'='a' ✓</text>

  <g transform="translate(375, 135)">
    <rect x="-50" y="-18" width="100" height="36" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="0" y="6" font-family="monospace" font-size="12" fill="#047857" text-anchor="middle">lcs(1, 1)</text>
  </g>

  <!-- Level 2: From lcs(1,1), 'c' != 'b', so branch -->
  <line x1="345" y1="153" x2="240" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="175" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">skip word1</text>

  <line x1="405" y1="153" x2="510" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="475" y="175" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">skip word2</text>

  <!-- lcs(2,1) - skip 'c' from word1 -->
  <g transform="translate(210, 210)">
    <rect x="-50" y="-18" width="100" height="36" fill="#e0f2fe" stroke="#3498db" stroke-width="2" rx="6"/>
    <text x="0" y="6" font-family="monospace" font-size="12" fill="#2c3e50" text-anchor="middle">lcs(2, 1)</text>
  </g>

  <!-- lcs(1,2) - skip 'b' from word2 -->
  <g transform="translate(540, 210)">
    <rect x="-50" y="-18" width="100" height="36" fill="#e0f2fe" stroke="#3498db" stroke-width="2" rx="6"/>
    <text x="0" y="6" font-family="monospace" font-size="12" fill="#2c3e50" text-anchor="middle">lcs(1, 2)</text>
  </g>

  <!-- Level 3: From lcs(2,1), 'e' != 'b' -->
  <line x1="180" y1="228" x2="110" y2="265" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="228" x2="280" y2="265" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g transform="translate(90, 285)">
    <rect x="-40" y="-15" width="80" height="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="5"/>
    <text x="0" y="5" font-family="monospace" font-size="11" fill="#6b7280" text-anchor="middle">lcs(3, 1)</text>
  </g>

  <g transform="translate(295, 285)">
    <rect x="-40" y="-15" width="80" height="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="5"/>
    <text x="0" y="5" font-family="monospace" font-size="11" fill="#6b7280" text-anchor="middle">lcs(2, 2)</text>
  </g>

  <!-- From lcs(1,2), 'c'='c' match! -->
  <line x1="540" y1="228" x2="540" y2="265" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="560" y="250" font-family="Arial, sans-serif" font-size="10" fill="#10b981">'c'='c' ✓</text>

  <g transform="translate(540, 285)">
    <rect x="-40" y="-15" width="80" height="30" fill="#d1fae5" stroke="#10b981" stroke-width="2" rx="5"/>
    <text x="0" y="5" font-family="monospace" font-size="11" fill="#047857" text-anchor="middle">lcs(2, 3)</text>
  </g>

  <!-- Dots to show continuation -->
  <text x="90" y="330" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">...</text>
  <text x="295" y="330" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">...</text>
  <text x="540" y="330" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">...</text>

  <!-- Legend -->
  <rect x="30" y="345" width="690" height="45" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" rx="6"/>

  <g transform="translate(50, 362)">
    <rect x="0" y="0" width="16" height="16" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="2"/>
    <text x="24" y="13" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Match → diagonal + 1</text>
  </g>

  <g transform="translate(200, 362)">
    <rect x="0" y="0" width="16" height="16" fill="#e0f2fe" stroke="#3498db" stroke-width="1.5" rx="2"/>
    <text x="24" y="13" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">No match → try both branches</text>
  </g>

  <g transform="translate(420, 362)">
    <rect x="0" y="0" width="16" height="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
    <text x="24" y="13" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Memoization caches results</text>
  </g>

  <!-- Memoization note -->
  <g transform="translate(650, 210)">
    <rect x="-30" y="-40" width="100" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="5"/>
    <text x="20" y="-20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Memo</text>
    <text x="20" y="-5" font-family="monospace" font-size="9" fill="#92400e" text-anchor="middle">(1,2) → ?</text>
    <text x="20" y="8" font-family="monospace" font-size="9" fill="#92400e" text-anchor="middle">(2,1) → ?</text>
  </g>
</svg>