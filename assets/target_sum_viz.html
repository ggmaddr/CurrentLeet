<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 24px; }
  .inputs { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
  input { background: #222; border: 1px solid #444; color: #FFD700; padding: 5px 8px; font-family: 'Courier New', monospace; font-size: 13px; width: 160px; border-radius: 3px; }
  button { background: #FFD700; color: #111; border: none; padding: 6px 14px; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 3px; }
  .info { font-size: 12px; color: #888; margin-bottom: 16px; }
  .info span { color: #FFD700; }
  canvas { display: block; }
  .legend { display: flex; gap: 20px; margin-top: 12px; font-size: 12px; }
  .leg { display: flex; align-items: center; gap: 6px; }
  .leg-line { width: 30px; height: 3px; }
</style>
</head>
<body>

<div class="inputs">
  <input id="nums" value="1,3,4,5,7" placeholder="nums (comma separated)"/>
  <input id="target" value="4" placeholder="target"/>
  <button onclick="run()">Visualize</button>
</div>

<div class="info" id="info"></div>

<canvas id="c"></canvas>

<div class="legend">
  <div class="leg"><div class="leg-line" style="background:#a855f7"></div> +num (purple)</div>
  <div class="leg"><div class="leg-line" style="background:#4ade80"></div> -num (green)</div>
  <div class="leg"><div class="leg-line" style="background:#FFD700; height:3px; border: 2px solid #FFD700"></div> answer path</div>
</div>

<script>
function run() {
  const nums = document.getElementById('nums').value.split(',').map(Number);
  const target = parseInt(document.getElementById('target').value);
  const n = nums.length;
  const total = nums.reduce((a,b)=>a+b,0);
  const offset = total;
  const size = 2*total+1;

  // build dp
  const dp = Array.from({length:n+1}, ()=>new Array(size).fill(0));
  dp[0][offset] = 1;
  for (let i=1;i<=n;i++) {
    const num = nums[i-1];
    for (let idx=0;idx<size;idx++) {
      if (idx-num>=0)   dp[i][idx] += dp[i-1][idx-num];
      if (idx+num<size) dp[i][idx] += dp[i-1][idx+num];
    }
  }

  // collect arrows
  const arrows = [];
  for (let i=1;i<=n;i++) {
    const num = nums[i-1];
    for (let idx=0;idx<size;idx++) {
      if (dp[i][idx]===0) continue;
      if (idx-num>=0 && dp[i-1][idx-num]>0)
        arrows.push({fi:i-1,fs:idx-num-offset, ti:i, ts:idx-offset, sign:+1, num});
      if (idx+num<size && dp[i-1][idx+num]>0)
        arrows.push({fi:i-1,fs:idx+num-offset, ti:i, ts:idx-offset, sign:-1, num});
    }
  }

  // only show sums that appear
  const activeSums = new Set();
  for (let i=0;i<=n;i++)
    for (let s=-total;s<=total;s++)
      if (dp[i][s+offset]>0) activeSums.add(s);
  const sums = [...activeSums].sort((a,b)=>a-b);
  const sumIdx = Object.fromEntries(sums.map((s,i)=>[s,i]));

  const answer = dp[n][target+offset];
  document.getElementById('info').innerHTML =
    `nums = <span>[${nums}]</span>  target = <span>${target}</span>  total = <span>${total}</span>  P=(total+target)/2 = <span>${(total+target)/2}</span>  answer = <span>${answer}</span>`;

  // layout
  const cw = 64, ch = 56;
  const padL = 100, padT = 70, padB = 40;
  const W = padL + sums.length*cw + 40;
  const H = padT + (n+1)*ch + padB;

  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  // helpers
  const cx = (s) => padL + sumIdx[s]*cw + cw/2;
  const cy = (i) => padT + i*ch + ch/2;

  // draw arrows first (behind cells)
  for (const a of arrows) {
    const x1=cx(a.fs), y1=cy(a.fi), x2=cx(a.ts), y2=cy(a.ti);
    const isAnswer = (a.ts===target && a.ti===n);
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle = isAnswer ? '#FFD700' : a.sign===1 ? '#a855f7' : '#4ade80';
    ctx.lineWidth = isAnswer ? 2.5 : 1.2;
    ctx.globalAlpha = isAnswer ? 1 : 0.5;
    ctx.stroke();
    // arrowhead
    const ang = Math.atan2(y2-y1, x2-x1);
    const al = 8;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2-al*Math.cos(ang-0.4), y2-al*Math.sin(ang-0.4));
    ctx.lineTo(x2-al*Math.cos(ang+0.4), y2-al*Math.sin(ang+0.4));
    ctx.closePath();
    ctx.fillStyle = isAnswer ? '#FFD700' : a.sign===1 ? '#a855f7' : '#4ade80';
    ctx.fill();
    ctx.globalAlpha = 1;
    // label
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    ctx.font = '10px Courier New';
    ctx.fillStyle = a.sign===1 ? '#c084fc' : '#86efac';
    ctx.textAlign = 'center';
    const label = a.sign===1 ? `+${a.num}` : `-${a.num}`;
    ctx.fillText(label, mx+6, my-3);
  }

  // draw cells
  for (let i=0;i<=n;i++) {
    for (const s of sums) {
      const v = dp[i][s+offset];
      if (v===0) continue;
      const x=cx(s)-18, y=cy(i)-16, w=36, h=32;
      const isAns = (i===n && s===target);
      ctx.fillStyle = isAns ? '#1a3a1a' : '#1e1e1e';
      ctx.strokeStyle = isAns ? '#FFD700' : '#444';
      ctx.lineWidth = isAns ? 2 : 1;
      ctx.beginPath();
      ctx.roundRect(x,y,w,h,4);
      ctx.fill(); ctx.stroke();
      ctx.font = isAns ? 'bold 15px Courier New' : '14px Courier New';
      ctx.fillStyle = isAns ? '#FFD700' : '#e0e0e0';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(v, cx(s), cy(i));
    }
  }

  // col headers — two rows: j index (top) and curSum value (bottom)
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let si=0; si<sums.length; si++) {
    const s = sums[si];
    const x = padL + si*cw + cw/2;
    // j index row (top)
    ctx.font = '10px Courier New';
    ctx.fillStyle = s===target ? '#FFD700' : '#555';
    ctx.fillText(`j=${s+offset}`, x, 20);
    // curSum row (bottom)
    ctx.font = '12px Courier New';
    ctx.fillStyle = s===target ? '#FFD700' : '#888';
    ctx.fillText(s, x, 40);
  }

  // "curSum" label on left side
  ctx.font = '10px Courier New';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'right';
  ctx.fillText('j→', padL-6, 20);
  ctx.fillStyle = '#888';
  ctx.fillText('curSum→', padL-6, 40);

  // row headers
  ctx.textAlign = 'right';
  for (let i=0;i<=n;i++) {
    ctx.fillStyle = '#888';
    ctx.fillText(i===0 ? '""' : `±${nums[i-1]}`, padL-10, cy(i));
    ctx.fillStyle = '#555';
    ctx.fillText(`i=${i}`, padL-52, cy(i));
  }
}

run();
</script>
</body>
</html>
